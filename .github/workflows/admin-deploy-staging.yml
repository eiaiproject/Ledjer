name: Admin Deploy (Staging)

# Deploy the admin dashboard to the staging Worker (ledjer-admin-staging),
# which reads the ledjer-staging D1 database — a safe preview environment
# before touching production data.
#
# Triggered manually (workflow_dispatch) or on push to the `staging` branch
# when apps/admin files change.

on:
  push:
    branches: [staging]
    paths:
      - "apps/admin/**"
      - "apps/web/worker/db/migrations/**"
      - ".github/workflows/admin-deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm --filter admin typecheck

      - name: Build admin dashboard
        run: pnpm --filter admin build

      - name: Deploy to Cloudflare Workers (staging)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/admin
          wranglerVersion: 4.123.0
          command: deploy --env=staging

      - name: Post-deploy smoke check
        env:
          ADMIN_STAGING_URL: https://ledjer-admin-staging.eiai.workers.dev
        run: |
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -sS -o /tmp/admin_staging_body -w "%{http_code}" -L --max-time 15 --proto "=https" "$ADMIN_STAGING_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Admin staging returned HTTP 200 (attempt $i)"
              break
            fi
            echo "⚠️  Admin staging returned HTTP $HTTP_STATUS (attempt $i), retrying in 5s..."
            sleep 5
          done
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Admin staging returned HTTP $HTTP_STATUS after 5 attempts"
            head -c 500 /tmp/admin_staging_body
            exit 1
          fi
