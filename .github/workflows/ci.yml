name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm --filter web typecheck

      - name: ESLint
        run: pnpm --filter web lint

      - name: Vitest unit tests
        run: pnpm --filter web test

      - name: Production build
        run: pnpm --filter web build

  db-types-guard:
    name: "Guard: database types in sync"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify database types are in sync
        run: pnpm db-types:check

  supabase:
    name: Supabase migrations & SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (no scripts, ignore errors)        # SQL tests don't need frontend deps, but `supabase` CLI itself is
        # written in Go and doesn't need node_modules. Install is a no-op for
        # the SQL job, kept for future tooling that may run `pnpm exec`.
        run: pnpm install --ignore-scripts --no-frozen-lockfile || true

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
          supabase --version

      - name: Start local Supabase stack
        # `supabase start` brings up the full stack: Postgres, GoTrue (auth),
        # PostgREST, Realtime, Storage, Studio, Inbucket. The Postgres image
        # already has the `auth` schema, `auth.users`, `auth.uid()`, and the
        # `anon` / `authenticated` / `service_role` roles — exactly what our
        # migrations require.
        run: supabase start --workdir supabase

      - name: Apply migrations from empty DB and run SQL tests
        # `supabase db reset` drops the public schema, reapplies every
        # migration in supabase/migrations/ in sorted order, then runs the
        # `supabase/tests/` scripts defined in `supabase/config.toml`.
        # This is the canonical way to validate migrations + SQL tests
        # against a production-like Supabase Postgres.
        run: supabase db reset --workdir supabase --no-seed

      - name: Capture DB URL for diagnostic logging
        run: |
          supabase status --workdir supabase --output env | tee /tmp/supabase.env
          echo "DB URL components:"
          grep -E '^(DB_URL|POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD)=' /tmp/supabase.env || true

      - name: Run SQL tests explicitly via psql
        # Belt-and-suspenders: re-run the test files directly against the
        # Supabase Postgres so the CI log makes test PASS/FAIL explicit
        # regardless of config.toml test ordering.
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: "54322"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "Installing postgresql-client for psql..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          PSQL="psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1"

          echo "=== _test_helpers.sql ==="
          $PSQL -f supabase/tests/_test_helpers.sql

          echo "=== security_rls_tests.sql ==="
          $PSQL -f supabase/tests/security_rls_tests.sql

          echo "=== golden_scenario_tests.sql ==="
          $PSQL -f supabase/tests/golden_scenario_tests.sql

          echo "=== inventory_golden_tests.sql ==="
          $PSQL -f supabase/tests/inventory_golden_tests.sql

          echo "=== accounting_regression_tests.sql ==="
          $PSQL -f supabase/tests/accounting_regression_tests.sql

          echo "=== p0_critical_fix_tests.sql ==="
          $PSQL -f supabase/tests/p0_critical_fix_tests.sql

          echo "=== opening_balance_guard_tests.sql ==="
          $PSQL -f supabase/tests/opening_balance_guard_tests.sql

          echo "=== payable_behavior_tests.sql ==="
          $PSQL -f supabase/tests/payable_behavior_tests.sql

          echo "=== permission_matrix_tests.sql ==="
          $PSQL -f supabase/tests/permission_matrix_tests.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --workdir supabase --no-backup || true

  guard-no-test-assert-in-migrations:
    name: "Guard: no test code in migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any migration references the test helper
        run: |
          if grep -RI "_test_assert" supabase/migrations/; then
            echo "ERROR: _test_assert found in migrations" >&2
            exit 1
          fi
          echo "OK: no _test_assert in migrations"

  guard-package-clean:
    name: "Guard: source archive excludes secrets and generated artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip and tar (for archive inspection)
        run: sudo apt-get install -y -qq unzip tar >/dev/null
      - name: Create source tarball via git archive
        run: |
          git archive --format=tar.gz --output=/tmp/ledjer-src.tar.gz HEAD
      - name: Create source zip via git ls-files
        run: |
          git ls-files | zip -@ /tmp/ledjer-src.zip
      - name: Run packaging guard against both archives
        run: |
          set -e
          chmod +x scripts/check-package-clean.sh
          ./scripts/check-package-clean.sh /tmp/ledjer-src.tar.gz
          ./scripts/check-package-clean.sh /tmp/ledjer-src.zip
