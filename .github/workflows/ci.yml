name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm --filter web typecheck

      - name: ESLint
        run: pnpm --filter web lint

      - name: Vitest unit tests
        run: pnpm --filter web test

      - name: Production build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm --filter web build

      - name: Scan build output for leaked secrets
        run: bash scripts/check-build-secrets.sh

      - name: D1 migration naming guard
        run: bash scripts/check-migration-naming.sh

  d1-migrations:
    name: D1 migrations from empty local database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm --filter web db:migrations:apply:local -- --persist-to "$RUNNER_TEMP/ledjer-d1"

  package-clean:
    name: Package clean guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install archive tooling
        run: sudo apt-get install -y -qq unzip tar zip >/dev/null

      - name: Create source archives
        run: |
          git archive --format=tar.gz --output=/tmp/ledjer-src.tar.gz HEAD
          git ls-files | zip -@ /tmp/ledjer-src.zip

      - name: Run packaging guard
        run: |
          ./scripts/check-package-clean.sh /tmp/ledjer-src.tar.gz
          ./scripts/check-package-clean.sh /tmp/ledjer-src.zip

  e2e-public:
    name: Playwright public smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run public smoke tests
        env:
          E2E_MODE: local-smoke
          E2E_BASE_URL: http://localhost:4173
          CI: true
        run: pnpm --filter web exec playwright test e2e/smoke.spec.ts e2e/security-public.spec.ts e2e/static-routes.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-public
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual-regression:
    name: Visual regression (public pages)
    needs: e2e-public
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ponytail: e2e/visual.spec.ts is not implemented yet (see issue tracking baseline
    # generation workflow). Job is wired in so the dependency chain is visible, but
    # marked continue-on-error to avoid blocking PRs. Remove when visual.spec.ts lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run visual regression tests
        env:
          E2E_MODE: local-smoke
          E2E_VISUAL: "1"
          E2E_BASE_URL: http://localhost:4173
          CI: true
        run: pnpm --filter web exec playwright test e2e/visual.spec.ts --project=chromium

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── SonarCloud scan ─────────────────────────────────────────────────
  # Runs only on PRs (or push to main) when SONAR_TOKEN is configured.
  # The official SonarCloud GitHub App auto-creates a check-run but uses
  # stale analysis data; this job forces a fresh scan per commit.
  #
  # ponytail: job has continue-on-error: true so missing SONAR_TOKEN
  # secret does not fail the build. To enable: add SONAR_TOKEN via
  # https://sonarcloud.io → Account → Security, then bind it to this
  # repo (https://github.com/eiaiproject/Ledjer/settings/secrets/actions).
  sonarcloud:
    name: SonarCloud scan
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: apps/web
          args: >
            -Dsonar.organization=eiaiproject
            -Dsonar.projectKey=eiaiproject_Ledjer2
            -Dsonar.sources=src
            -Dsonar.tests=e2e
            -Dsonar.test.inclusions=e2e/**/*.spec.ts
            -Dsonar.exclusions=src/**/__tests__/**,src/**/*.test.ts,src/**/*.test.tsx,dist/**
