name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job A: Frontend Quality ────────────────────────────────
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm --filter web typecheck

      - name: ESLint
        run: pnpm --filter web lint

      - name: Vitest unit tests
        run: pnpm --filter web test

      - name: Production build
        run: pnpm --filter web build

  # ─── Job B: Database Types Guard ────────────────────────────
  db-types-guard:
    name: "Guard: database types in sync"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify database types are in sync
        run: pnpm db-types:check

  # ─── Job C: SQL / Supabase Tests ────────────────────────────
  supabase:
    name: Supabase migrations & SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (no scripts, frozen lockfile)
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail
          command -v supabase
          supabase --version

      - name: Validate migration filenames
        run: bash scripts/check-migration-naming.sh

      - name: Start local Supabase stack
        run: supabase start --workdir . --debug

      - name: Capture Supabase diagnostics (always)
        if: always()
        run: |
          echo "=== Supabase status ==="
          supabase status --workdir . || true
          echo "=== Docker containers ==="
          docker ps -a || true

      - name: Apply migrations from empty DB
        run: supabase db reset --workdir . --no-seed --debug

      - name: Capture DB URL for diagnostic logging
        if: success()
        run: |
          supabase status --workdir . --output env > /tmp/supabase.env
          echo "DB URL components:"
          grep -E '^(DB_URL|POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD)=' /tmp/supabase.env || true

      - name: Check database types drift
        run: |
          set -euo pipefail
          supabase gen types typescript --local --schema public > /tmp/database-types.generated.ts
          cp packages/database-types/index.ts /tmp/database-types.expected.ts
          perl -0pi -e 's/\n+\z/\n/' /tmp/database-types.expected.ts /tmp/database-types.generated.ts
          diff -u /tmp/database-types.expected.ts /tmp/database-types.generated.ts
          echo "✅ Database types match"

      - name: Run SQL tests explicitly via psql
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: "54322"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "Installing postgresql-client for psql..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/run_all.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --workdir . --no-backup || true

  # ─── Job D: Guards ─────────────────────────────────────────
  guard-no-test-assert-in-migrations:
    name: "Guard: no test code in migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail if any migration references the test helper
        run: |
          if grep -RI "_test_assert" supabase/migrations/; then
            echo "ERROR: _test_assert found in migrations" >&2
            exit 1
          fi
          echo "OK: no _test_assert in migrations"

  guard-package-clean:
    name: "Guard: source archive excludes secrets and generated artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install unzip and tar (for archive inspection)
        run: sudo apt-get install -y -qq unzip tar >/dev/null
      - name: Create source tarball via git archive
        run: |
          git archive --format=tar.gz --output=/tmp/ledjer-src.tar.gz HEAD
      - name: Create source zip via git ls-files
        run: |
          git ls-files | zip -@ /tmp/ledjer-src.zip
      - name: Run packaging guard against both archives
        run: |
          set -e
          chmod +x scripts/check-package-clean.sh
          ./scripts/check-package-clean.sh /tmp/ledjer-src.tar.gz
          ./scripts/check-package-clean.sh /tmp/ledjer-src.zip

  # ─── Job E: Full E2E Local (Chromium) ──────────────────────
  e2e-full-local:
    name: "E2E Full Local (Chromium + Supabase)"
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Start local Supabase stack
        run: supabase start --workdir . --debug

      - name: Apply migrations
        run: supabase db reset --workdir . --no-seed

      - name: Capture Supabase env vars
        run: supabase status --workdir . --output env > /tmp/supabase.env

      - name: Export Supabase keys
        run: |
          set -euo pipefail
          source /tmp/supabase.env

          supabase_url="${API_URL:-${SUPABASE_URL:-http://localhost:54321}}"
          supabase_anon_key="${ANON_KEY:-}"
          supabase_service_role_key="${SERVICE_ROLE_KEY:-}"

          if [ -z "$supabase_anon_key" ]; then
            echo '::error::SUPABASE_ANON_KEY is empty after export. Check supabase status output.'
            exit 1
          fi

          if [ -z "$supabase_service_role_key" ]; then
            echo '::error::SUPABASE_SERVICE_ROLE_KEY is empty after export. Check supabase status output.'
            exit 1
          fi

          echo "::add-mask::$supabase_anon_key"
          echo "::add-mask::$supabase_service_role_key"

          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$supabase_service_role_key"
            echo "VITE_SUPABASE_URL=$supabase_url"
            echo "VITE_SUPABASE_ANON_KEY=$supabase_anon_key"
          } >> "$GITHUB_ENV"

      - name: Build app for preview
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: pnpm --filter web build

      - name: Run full E2E (Chromium)
        env:
          E2E_MODE: full-local
          E2E_BASE_URL: http://localhost:4173
          E2E_SUPABASE_URL: http://localhost:54321
          E2E_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          CI: true
        run: pnpm --filter web exec playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-full-local
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-full-local
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-full-local
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir . --no-backup || true

  # ─── Job F: Cross-Browser Smoke ─────────────────────────────
  e2e-cross-browser:
    name: "E2E Cross-Browser Smoke (Firefox + WebKit)"
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: Build for preview server
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.signature
        run: pnpm --filter web build

      - name: Run smoke on Firefox
        env:
          E2E_MODE: deploy-smoke
          E2E_BASE_URL: http://localhost:4173
          E2E_CROSS_BROWSER: 1
          CI: true
        run: pnpm --filter web exec playwright test e2e/smoke.spec.ts e2e/accessibility.spec.ts e2e/responsive.spec.ts --project=firefox

      - name: Run smoke on WebKit
        env:
          E2E_MODE: deploy-smoke
          E2E_BASE_URL: http://localhost:4173
          E2E_CROSS_BROWSER: 1
          CI: true
        run: pnpm --filter web exec playwright test e2e/smoke.spec.ts e2e/accessibility.spec.ts e2e/responsive.spec.ts --project=webkit

      - name: Upload cross-browser report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-cross-browser
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Job H: Visual Regression ───────────────────────────────
  visual-regression:
    name: "Visual Regression (Linux Chromium)"
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Start local Supabase stack
        run: supabase start --workdir . --debug

      - name: Apply migrations
        run: supabase db reset --workdir . --no-seed

      - name: Capture Supabase keys
        run: supabase status --workdir . --output env > /tmp/supabase.env

      - name: Export Supabase keys
        run: |
          set -euo pipefail
          source /tmp/supabase.env

          supabase_url="${API_URL:-${SUPABASE_URL:-http://localhost:54321}}"
          supabase_anon_key="${ANON_KEY:-}"
          supabase_service_role_key="${SERVICE_ROLE_KEY:-}"

          if [ -z "$supabase_anon_key" ]; then
            echo '::error::ANON_KEY empty — cannot run visual tests'
            exit 1
          fi

          echo "::add-mask::$supabase_anon_key"
          echo "::add-mask::$supabase_service_role_key"

          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$supabase_service_role_key"
            echo "VITE_SUPABASE_URL=$supabase_url"
            echo "VITE_SUPABASE_ANON_KEY=$supabase_anon_key"
          } >> "$GITHUB_ENV"

      - name: Build app
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: pnpm --filter web build

      # CI compares snapshots against committed baselines. To update baselines
      # locally, run: pnpm --filter web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots
      # Do NOT use --update-snapshots in CI — it masks visual regressions.
      - name: Run visual regression tests (compare against baselines)
        env:
          E2E_MODE: full-local
          E2E_VISUAL: "1"
          E2E_BASE_URL: http://localhost:4173
          E2E_SUPABASE_URL: http://localhost:54321
          E2E_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          CI: true
        run: pnpm --filter web exec playwright test e2e/visual.spec.ts --project=chromium

      - name: Upload updated baselines
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-baselines-linux
          path: apps/web/e2e/visual.spec.ts-snapshots/*.png
          retention-days: 30

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir . --no-backup || true
