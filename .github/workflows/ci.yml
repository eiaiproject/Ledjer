name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm --filter web typecheck

      - name: ESLint
        run: pnpm --filter web lint

      - name: Vitest unit tests
        run: pnpm --filter web test

      - name: Production build
        run: pnpm --filter web build

  db-types-guard:
    name: "Guard: database types in sync"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify database types are in sync
        run: pnpm db-types:check

  supabase:
    name: Supabase migrations & SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (no scripts)
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          SUPABASE_VERSION="v2.107.0"
          echo "Installing Supabase CLI ${SUPABASE_VERSION}..."
          curl -fsSL "https://github.com/supabase/cli/releases/download/${SUPABASE_VERSION}/supabase_linux_amd64.tar.gz" \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin supabase
          supabase --version

      - name: Validate migration filenames
        run: bash scripts/check-migration-naming.sh

      - name: Start local Supabase stack
        run: supabase start --workdir . --debug

      - name: Capture Supabase diagnostics (always)
        if: always()
        run: |
          echo "=== Supabase status ==="
          supabase status --workdir . || true
          echo "=== Docker containers ==="
          docker ps -a || true
          echo "=== Supabase container logs ==="
          docker logs $(docker ps -aq --filter "name=supabase-db" | head -1) 2>&1 | tail -50 || true
          docker logs $(docker ps -aq --filter "name=supabase-auth" | head -1) 2>&1 | tail -20 || true

      - name: Apply migrations from empty DB
        run: supabase db reset --workdir . --no-seed --debug

      - name: Capture DB URL for diagnostic logging
        if: success()
        run: |
          supabase status --workdir . --output env | tee /tmp/supabase.env
          echo "DB URL components:"
          grep -E '^(DB_URL|POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD)=' /tmp/supabase.env || true

      - name: Run SQL tests explicitly via psql
        # Belt-and-suspenders: re-run the test files directly against the
        # Supabase Postgres so the CI log makes test PASS/FAIL explicit
        # regardless of config.toml test ordering.
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: "54322"
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            echo "Installing postgresql-client for psql..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          # Single source of truth for suite ordering lives in run_all.sql.
          # ON_ERROR_STOP=1 turns any RAISE EXCEPTION (test failure) into a
          # non-zero exit. Run from repo root so the \i relative paths resolve.
          psql -h localhost -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/run_all.sql

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --workdir . --no-backup || true

  guard-no-test-assert-in-migrations:
    name: "Guard: no test code in migrations"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Fail if any migration references the test helper
        run: |
          if grep -RI "_test_assert" supabase/migrations/; then
            echo "ERROR: _test_assert found in migrations" >&2
            exit 1
          fi
          echo "OK: no _test_assert in migrations"

  guard-package-clean:
    name: "Guard: source archive excludes secrets and generated artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install unzip and tar (for archive inspection)
        run: sudo apt-get install -y -qq unzip tar >/dev/null
      - name: Create source tarball via git archive
        run: |
          git archive --format=tar.gz --output=/tmp/ledjer-src.tar.gz HEAD
      - name: Create source zip via git ls-files
        run: |
          git ls-files | zip -@ /tmp/ledjer-src.zip
      - name: Run packaging guard against both archives
        run: |
          set -e
          chmod +x scripts/check-package-clean.sh
          ./scripts/check-package-clean.sh /tmp/ledjer-src.tar.gz
          ./scripts/check-package-clean.sh /tmp/ledjer-src.zip
