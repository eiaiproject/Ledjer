name: Dependency Security Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday

permissions:
  contents: read
  actions: read

jobs:
  osv-scan:
    name: OSV Vulnerability Scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: false

  pnpm-audit:
    name: pnpm audit (blocking)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Cold runners (checkout + pnpm setup + node setup + install + audit) have
    # exceeded 5 minutes several times, which cancelled the job mid-run. 10 min
    # covers cold-cache installs while still failing fast on real hangs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency audit with exception handling
        run: bash scripts/check-dependency-audit.sh
