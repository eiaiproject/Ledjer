name: Auto Deploy

# Deploys to Cloudflare Workers on push to main, or manually via workflow_dispatch.
# CI must pass before merge to main (branch protection), so deploy is safe to auto-run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (default: main)"
        required: false
        default: main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy to Cloudflare Workers"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ledjer.id
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build production
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm --filter web build

      - name: Run post-build security scan
        run: bash scripts/check-build-secrets.sh

      - name: Run D1 migrations (production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter web exec wrangler d1 migrations apply ledjer-production --remote

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter web exec wrangler deploy

      - name: Run production smoke test
        run: |
          echo "Checking health endpoint: https://ledjer.id/api/health"
          curl -fsS "https://ledjer.id/api/health" -o /dev/null --max-time 15
          echo "✅ Health endpoint OK"
          echo "Checking frontend routing: https://ledjer.id/"
          status=$(curl -sI "https://ledjer.id/" -o /dev/null -w "%{http_code}" --max-time 15)
          echo "Frontend returned HTTP $status"
          # 302 is expected (Zero Trust Access redirect) — confirms Worker is routing
          if [ "$status" != "000" ]; then
            echo "✅ Frontend routing OK (HTTP $status)"
          else
            echo "❌ Frontend unreachable"
            exit 1
          fi

      - name: Summary
        run: |
          echo "### ✅ Deploy to Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ inputs.branch || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://ledjer.id" >> $GITHUB_STEP_SUMMARY
