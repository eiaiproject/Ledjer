name: Deploy to Cloudflare Pages

# Manual-only. Cloudflare Pages Git integration auto-deploys main to production.
# This workflow exists for emergency/manual Wrangler deploys if needed.
# Uses Wrangler v4 via pnpm exec (root devDependency) — NOT the deprecated
# cloudflare/wrangler-action@v3.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (default: main)"
        required: false
        default: main

concurrency:
  group: deploy-manual
  cancel-in-progress: true

permissions:
  contents: write  # needed for Pages deploy

jobs:
  deploy:
    name: "Manual deploy to Cloudflare Pages"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://ledjer.id
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm --filter web build

      - name: Deploy to Cloudflare Pages
        run: |
          pnpm exec wrangler pages deploy apps/web/dist \
            --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME:-ledjer}" \
            --branch="${{ inputs.branch || 'main' }}"

      - name: Summary
        run: |
          echo "### ✅ Manual deploy to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ inputs.branch || 'main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://ledjer.id" >> $GITHUB_STEP_SUMMARY
