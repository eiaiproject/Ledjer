name: Docs Deploy

# Build the public docs site (apps/docs, VitePress) and deploy it to
# Cloudflare Workers as static assets → https://docs.ledjer.id

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build docs site
        run: pnpm --filter docs build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/docs
          wranglerVersion: 4.120.1
          command: deploy

      - name: Post-deploy smoke check
        env:
          DOCS_URL: https://docs.ledjer.id
        run: |
          for i in 1 2 3 4 5; do
            HTTP_STATUS=$(curl -sS -o /tmp/docs_body -w "%{http_code}" -L --max-time 15 --proto "=https" "$DOCS_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Docs site returned HTTP 200 (attempt $i)"
              break
            fi
            echo "⚠️  Docs site returned HTTP $HTTP_STATUS (attempt $i), retrying in 5s..."
            sleep 5
          done
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Docs site returned HTTP $HTTP_STATUS after 5 attempts"
            head -c 500 /tmp/docs_body
            exit 1
          fi
