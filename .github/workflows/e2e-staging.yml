name: E2E Staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Serialize staging deploys + E2E runs. A batch of PRs (e.g. dependabot)
# landing at once would otherwise deploy over each other and burst the
# shared staging Worker with parallel logins, tripping login rate limits
# (403 lockout / 429) and failing every run.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'staging@yopmail.com' }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'Staging1234' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build app
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare Workers (staging)
        # Deploy directly with wrangler. node_modules was installed with
        # --ignore-scripts by the Install step above, so no lifecycle scripts
        # (e.g. run-s postinstalls from @hookform/resolvers / globals) run.
        # Mirrors auto-deploy.yml, which succeeds where wrangler-action's
        # implicit `pnpm install` triggered run-s postinstall failures.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env=staging --config=wrangler.jsonc
        # Fail fast on deploy failure. We must never fall back to running
        # CRUD tests against production (they create real data).

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install chromium --with-deps
        working-directory: apps/web

      - name: Create E2E session token (staging D1)
        # Insert a session row directly into the staging D1 and export the raw
        # token. The auth fixture then injects the cookie and skips the login
        # API, so dozens of parallel tests never burst the Worker's login rate
        # limit (10/IP+email per 15 min) - which previously stalled the whole
        # suite in authPage with 30s fixture timeouts.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          E2E_D1: ledjer-staging
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'staging@yopmail.com' }}
        run: node scripts/create-e2e-session.mjs >> "$GITHUB_ENV"

      - name: Run E2E tests (MVP core specs)
        run: pnpm exec playwright test e2e/smoke.spec.ts e2e/auth.spec.ts e2e/auth-flows.spec.ts e2e/new-transaction.spec.ts e2e/accounts.spec.ts e2e/profit-loss.spec.ts e2e/balance-sheet.spec.ts e2e/settings-crud.spec.ts e2e/exports.spec.ts e2e/security-public.spec.ts e2e/security-headers.spec.ts e2e/csrf.spec.ts e2e/injection.spec.ts e2e/static-routes.spec.ts --project=chromium --reporter=github,html --workers=2 --retries=1
        working-directory: apps/web
        env:
          # The fixture falls back to UI login only when no session token is
          # exported (e.g. local ad-hoc runs); CI always uses the injected
          # session from the step above.
          E2E_BASE_URL: https://ledjer-staging.eiai.workers.dev

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
