name: E2E Staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ledjer@yopmail.com
      E2E_PASSWORD: Ledjer26#

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build app
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare Workers (staging)
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/web
          command: deploy --env=staging
        continue-on-error: true

      - name: Determine test target URL
        id: target
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "BASE_URL=https://ledjer-staging.eiai.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "BASE_URL=https://ledjer.id" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium --with-deps --ignore-scripts
        working-directory: apps/web

      - name: Run E2E CRUD tests
        run: pnpm exec playwright test e2e/full-crud.spec.ts e2e/masterdata-crud.spec.ts e2e/settings-crud.spec.ts e2e/documents-crud.spec.ts --project=chromium --reporter=github,html
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.BASE_URL }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
