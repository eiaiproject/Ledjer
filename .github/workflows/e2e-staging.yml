name: E2E Staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Serialize staging deploys + E2E runs. A batch of PRs (e.g. dependabot)
# landing at once would otherwise deploy over each other and burst the
# shared staging Worker with parallel logins, tripping login rate limits
# (403 lockout / 429) and failing every run.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'staging@yopmail.com' }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'Staging1234' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build app
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare Workers (staging)
        # v4.0.0 runs on Node 24. The old v3.15.0 pin (node20) is forced onto
        # Node 24 by GitHub Actions - a known failure mode for this action's
        # internal `npx wrangler` call ("The process npx failed with exit
        # code 1") that made deploys flaky. Pin wranglerVersion to the
        # lockfile's so every run deploys with the same CLI version.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/web
          wranglerVersion: 4.123.0
          command: deploy --env=staging --config=wrangler.jsonc
        # Fail fast on deploy failure. We must never fall back to running
        # CRUD tests against production (they create real data).

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install chromium --with-deps
        working-directory: apps/web

      - name: Run E2E CRUD tests
        run: pnpm exec playwright test e2e/full-crud.spec.ts e2e/masterdata-crud.spec.ts e2e/settings-crud.spec.ts e2e/documents-crud.spec.ts --project=chromium --reporter=github,html --workers=2 --retries=1
        working-directory: apps/web
        env:
          # Low parallelism + login retries in the auth fixture keep us under
          # the staging Worker's login rate limits even on shared runners.
          E2E_BASE_URL: https://ledjer-staging.eiai.workers.dev

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
