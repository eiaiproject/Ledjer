name: E2E Staging

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  deploy-and-test:
    runs-on: ubuntu-22.04
    env:
      E2E_EMAIL: ledjer@yopmail.com
      E2E_PASSWORD: Ledjer26#
      # Override base URL after deploy step via deploy output

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        working-directory: apps/web

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: apps/web
          command: deploy --env=staging
        continue-on-error: true

      # If Cloudflare Workers deploy succeeds, use the staging URL
      - name: Set test target URL
        id: target
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "BASE_URL=https://ledjer-staging.yourdomain.com" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=https://ledjer.id" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - name: Run E2E CRUD tests
        run: pnpm exec playwright test e2e/full-crud.spec.ts e2e/masterdata-crud.spec.ts e2e/settings-crud.spec.ts e2e/documents-crud.spec.ts --project=chromium --reporter=github,html
        working-directory: apps/web
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
