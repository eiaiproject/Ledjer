name: Production Smoke Test

# Manual/scheduled smoke test for the Cloudflare Pages production deployment.
# Does NOT deploy anything — only validates the current production URL.
# Production URL: https://ledjer.id

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

env:
  PRODUCTION_URL: https://ledjer.id

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: "Production Smoke (ledjer.id) — READ-ONLY"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Preflight — production URL is reachable (HTTP 200)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Checking production URL: ${PRODUCTION_URL}"
          AUTH_ARGS=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            AUTH_ARGS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          curl -fsS "${AUTH_ARGS[@]}" "${PRODUCTION_URL}" -o /dev/null --max-time 15
          echo "✅ Production URL is reachable"

      # Ensure smoke tests never mutate production financial data:
      # - E2E_MODE=deploy-smoke selects only read-only test files
      # - Assert no POST/PUT/PATCH/DELETE requests are made
      - name: Run production smoke tests (read-only enforcement)
        env:
          E2E_MODE: deploy-smoke
          E2E_BASE_URL: ${PRODUCTION_URL}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CI: true
        run: |
          pnpm --filter web exec playwright test e2e/smoke.spec.ts e2e/security-public.spec.ts e2e/static-routes.spec.ts --project=chromium

      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-smoke-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Job B: Production CSP Check ─────────────────────────────
  csp-check:
    name: "Production CSP Check (strict validation)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # ── Helper bash function: add CF Access headers when available ──
      - name: Validate CSP header exists and contains required directives
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Build curl auth args if CF Access credentials are available
          AUTH_ARGS=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            AUTH_ARGS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi

          RESPONSE=$(curl -sI "${AUTH_ARGS[@]}" "${PRODUCTION_URL}")
          CSP=$(echo "$RESPONSE" | grep -i content-security-policy || true)

          if [ -z "$CSP" ]; then
            # Fall back: check for CSP meta tag in HTML body
            HTML=$(curl -s "${AUTH_ARGS[@]}" "${PRODUCTION_URL}")
            META_CSP=$(echo "$HTML" | grep -i 'http-equiv="Content-Security-Policy"' || true)
            if [ -z "$META_CSP" ]; then
              echo "❌ No CSP found in HTTP headers or meta tag"
              exit 1
            fi
            CSP="$META_CSP"
            echo "ℹ️ Found CSP in meta tag"
          else
            echo "✅ CSP header found"
          fi

          # Normalize to single line and lowercase for directive checking
          CSP_NORMALIZED=$(echo "$CSP" | tr '[:upper:]' '[:lower:]' | tr '\n' ' ')
          echo "CSP (abbreviated): ${CSP_NORMALIZED:0:300}"

          # Validate required directives are present
          REQUIRED=("default-src" "script-src" "style-src" "base-uri" "form-action")
          MISSING=()
          for directive in "${REQUIRED[@]}"; do
            if echo "$CSP_NORMALIZED" | grep -q "${directive}"; then
              echo "  ✅ ${directive} present"
            else
              echo "  ❌ ${directive} MISSING"
              MISSING+=("$directive")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required CSP directives: ${MISSING[*]}"
            exit 1
          fi

          # Check for localhost in the full raw CSP text
          if echo "$CSP" | grep -iqE 'localhost|127\.0\.0\.1'; then
            echo "❌ Production CSP contains localhost origins"
            echo "$CSP"
            exit 1
          fi
          echo "✅ Production CSP is valid and no localhost origins"

      - name: Verify HTTP status and redirect chain
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          AUTH_ARGS=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            AUTH_ARGS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi

          FINAL_URL=$(curl -sS -o /dev/null -w "%{redirect_url}" --max-time 15 "${AUTH_ARGS[@]}" "${PRODUCTION_URL}")
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "${AUTH_ARGS[@]}" "${PRODUCTION_URL}")

          echo "Final HTTP status: $HTTP_STATUS"
          if [ -n "$FINAL_URL" ]; then
            echo "Final URL (after redirects): $FINAL_URL"
          fi

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "301" ] && [ "$HTTP_STATUS" != "302" ]; then
            echo "❌ Production URL returned unexpected HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Production URL is reachable (HTTP $HTTP_STATUS)"
