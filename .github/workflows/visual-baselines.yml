name: Generate visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to commit snapshot updates

jobs:
  visual-baselines:
    name: "Generate visual baselines (Linux Chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Start local Supabase stack
        run: supabase start --workdir . -x edge-runtime --debug

      - name: Apply migrations
        run: supabase db reset --workdir . --no-seed

      - name: Capture Supabase keys
        run: supabase status --workdir . --output env > /tmp/supabase.env

      - name: Export Supabase keys
        run: |
          set -euo pipefail
          source /tmp/supabase.env

          supabase_url="${API_URL:-${SUPABASE_URL:-http://localhost:54321}}"
          supabase_anon_key="${ANON_KEY:-}"
          supabase_service_role_key="${SERVICE_ROLE_KEY:-}"

          if [ -z "$supabase_anon_key" ]; then
            echo '::error::ANON_KEY empty — cannot run visual tests'
            exit 1
          fi

          echo "::add-mask::$supabase_anon_key"
          echo "::add-mask::$supabase_service_role_key"

          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$supabase_service_role_key"
            echo "VITE_SUPABASE_URL=$supabase_url"
            echo "VITE_SUPABASE_ANON_KEY=$supabase_anon_key"
          } >> "$GITHUB_ENV"

      - name: Build app
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          LEDJER_CSP_LOCAL: "1"
        run: pnpm --filter web build

      - name: Run visual regression tests (update baselines)
        env:
          E2E_MODE: full-local
          E2E_VISUAL: "1"
          E2E_BASE_URL: http://localhost:4173
          E2E_SUPABASE_URL: http://localhost:54321
          E2E_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          CI: true
        run: pnpm --filter web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "chore: update visual baselines [skip ci]"
          git push

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir . --no-backup || true
