name: Generate visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to commit snapshot updates

jobs:
  visual-baselines:
    name: "Generate visual baselines (Linux Chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Build app
        env:
          LEDJER_CSP_LOCAL: "1"
        run: pnpm --filter web build

      - name: Run visual regression tests (update baselines)
        env:
          E2E_MODE: local-smoke
          E2E_VISUAL: "1"
          E2E_BASE_URL: http://localhost:4173
          CI: true
        run: pnpm --filter web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "chore: update visual baselines [skip ci]"
          git push
