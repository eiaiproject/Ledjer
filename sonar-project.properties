# SonarCloud configuration for Ledjer
# https://sonarcloud.io/dashboard?id=eiaiproject_Ledjer2

sonar.projectKey=eiaiproject_Ledjer2
sonar.organization=eiaiproject

# Exclude SQL migration files from analysis — these are historical,
# already-applied migrations that naturally contain copy-pasted function
# definitions as they evolved. Analyzing them inflates duplication metrics
# without providing actionable value.
sonar.exclusions=**/supabase/migrations/**

# SQL migrations and permission matrices intentionally repeat DDL/RLS/test
# shapes. Keep them out of copy-paste detection so new-code duplication is
# measured on application code instead of historical database artifacts.
#
# CI-based Sonar scans read this file. SonarQube Cloud Automatic Analysis reads
# .sonarcloud.properties instead, so keep both files aligned when changing scope.
sonar.cpd.exclusions=**/supabase/migrations/**,**/supabase/tests/**/*.sql
