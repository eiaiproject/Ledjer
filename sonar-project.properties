# SonarCloud configuration for Ledjer
# https://sonarcloud.io/dashboard?id=eiaiproject_Ledjer2

sonar.projectKey=eiaiproject_Ledjer2
sonar.organization=eiaiproject

# Exclude archived historical reference code from analysis.
sonar.exclusions=archive/supabase-reference/**

# D1 migrations intentionally repeat DDL shapes. Keep them out of
# copy-paste detection so new-code duplication is measured on app code.
#
# CI-based Sonar scans read this file. SonarQube Cloud Automatic Analysis reads
# .sonarcloud.properties instead, so keep both files aligned when changing scope.
sonar.cpd.exclusions=apps/web/worker/db/migrations/**/*.sql,archive/supabase-reference/**
